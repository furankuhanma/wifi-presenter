<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Presentation Viewer</title>
<link rel="stylesheet" href="/style.css" />
<style>
  #authGate {
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 9999;
  }
  #authGate .auth-wrap {
    width: 100%;
    max-width: 340px;
    padding: 24px;
    font-family: system-ui, sans-serif;
    color: #fff;
  }
  #authGate .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  #authGate .auth-tabs button { flex: 1; padding: 8px; cursor: pointer; }
  #authGate .auth-tabs button.active { font-weight: bold; }
  #authGate .auth-form { display: flex; flex-direction: column; gap: 10px; }
  #authGate .auth-form input { padding: 10px; font-size: 16px; }
  #authGate .auth-form button[type="submit"] { padding: 12px; font-size: 16px; cursor: pointer; }
  #authMessage { min-height: 1.2em; font-size: 14px; margin-top: 8px; }
  #authMessage.error { color: #ff6b6b; }
  #authMessage.success { color: #51cf66; }

  /* ==================== QUIZ OVERLAY (NEW) ==================== */
  #quizOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 8888;
    background: rgba(5, 8, 20, 0.97);
    color: #fff;
    font-family: system-ui, sans-serif;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
  }
  #quizOverlay.active { display: flex; }
  #quizMeta { display: flex; justify-content: space-between; font-size: 13px; opacity: 0.8; margin-bottom: 10px; }
  #quizTimer { font-weight: bold; }
  #quizTimer.urgent { color: #ff6b6b; }
  #quizQuestionText { font-size: 22px; font-weight: 600; margin-bottom: 20px; line-height: 1.35; }
  #quizOptionsList { display: flex; flex-direction: column; gap: 12px; }
  .quiz-option-btn {
    padding: 16px; font-size: 17px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.06); color: #fff; cursor: pointer; text-align: left;
  }
  .quiz-option-btn:active { background: rgba(255,255,255,0.15); }
  .quiz-option-btn.selected { border-color: #4f9eff; background: rgba(79,158,255,0.25); }
  .quiz-option-btn.correct { border-color: #4caf50; background: rgba(76,175,80,0.3); }
  .quiz-option-btn.incorrect { border-color: #e05252; background: rgba(224,82,82,0.3); }
  .quiz-option-btn:disabled { cursor: default; }
  #quizIdentificationForm { display: flex; flex-direction: column; gap: 10px; }
  #quizIdentificationInput { padding: 14px; font-size: 17px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.06); color: #fff; }
  #quizSubmitBtn { padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; background: #4f9eff; color: #fff; cursor: pointer; }
  #quizFeedback { margin-top: 20px; text-align: center; font-size: 18px; }
  #quizFeedback.correct { color: #7ee787; }
  #quizFeedback.incorrect { color: #ff8a8a; }
  #quizWaiting { margin-top: 20px; text-align: center; opacity: 0.75; font-size: 14px; }
</style>
</head>
<body>

<div id="authGate">
  <div class="auth-wrap">
    <h2 id="authTitle">Log In to Join</h2>
    <div class="auth-tabs">
      <button id="tabLogin" type="button" class="active">Log In</button>
      <button id="tabSignup" type="button">Sign Up</button>
    </div>
    <form class="auth-form" id="authForm">
      <input id="username" type="text" placeholder="Username" autocomplete="username" required />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" id="submitBtn">Log In</button>
    </form>
    <div id="authMessage"></div>
  </div>
</div>

<div id="presentationRoot" style="display:none;">

  <div class="control-bar status-bar" id="statusBar">
    <span><span class="status-dot"></span><span id="slideNumber">Connecting…</span></span>
    <span>
      <button id="rotateBtn" title="Switch between landscape and portrait">Rotate</button>
    </span>
  </div>

  <div class="stage-outer" id="stageOuter">
    <div class="stage" id="stage"></div>
    <canvas id="whiteboardCanvas" style="display:none;"></canvas>
  </div>

  <!-- ==================== QUIZ OVERLAY (NEW) ==================== -->
  <div id="quizOverlay">
    <div id="quizMeta">
      <span id="quizDifficultyBadge">Medium · 10 XP</span>
      <span id="quizTimer"></span>
    </div>
    <div id="quizQuestionText"></div>

    <div id="quizOptionsList" style="display:none;"></div>

    <form id="quizIdentificationForm" style="display:none;">
      <input id="quizIdentificationInput" type="text" placeholder="Type your answer…" autocomplete="off" />
      <button id="quizSubmitBtn" type="submit">Submit Answer</button>
    </form>

    <div id="quizWaiting" style="display:none;">Answer submitted -- waiting for results…</div>
    <div id="quizFeedback" style="display:none;"></div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/render.js"></script>
<script src="/viewer.js"></script>
<script src="/viewer-quiz.js"></script>
<script src="/viewer-auth.js"></script>
</body>
</html>
