<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign in to Presentation Wi-Fi</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    height: 100dvh;
    background: #0b0b0f;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #eee;
  }
  .portal-screen {
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    background: #14141c;
  }
  .portal-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #3ecf5e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 22px;
    margin: 0;
  }
  p {
    color: #aaa;
    font-size: 14px;
    max-width: 320px;
    margin: 0;
  }
  .enter-btn {
    margin-top: 12px;
    font-size: 17px;
    padding: 14px 32px;
    border-radius: 8px;
    border: none;
    background: #4f81bd;
    color: #fff;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    min-width: 200px;
  }
  .enter-btn:active {
    background: #3f6a9c;
  }
  .fine-print {
    margin-top: 24px;
    font-size: 12px;
    color: #666;
  }
</style>
</head>
<body>
  <div class="portal-screen">
    <div class="portal-icon">📶</div>
    <h1>Connected to Presentation Wi-Fi</h1>
    <p>Tap below to open the live presentation. Your screen will stay in sync with the presenter automatically.</p>
    <a class="enter-btn" href="/">Enter Presentation</a>
    <p class="fine-print">No internet connection needed — this works entirely on the local network.</p>
  </div>
</body>
</html>
